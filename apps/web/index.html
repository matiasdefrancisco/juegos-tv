    <title>Party Draw — ¡Dibujá y Adiviná!</title>
    
    <!--
      Tipografías.

      Se cargan sin bloquear el render: el truco de media="print" + onload hace
      que el navegador las baje con prioridad baja y recién las aplique cuando
      llegan. En un televisor con DNS lento eso evitaba varios segundos de
      pantalla en blanco. `display=swap` muestra el texto con la fuente del
      sistema mientras tanto.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@400;500;600;700;900&display=swap"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@400;500;600;700;900&display=swap"
      >
    </noscript>
  </head>
